<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>

  <!-- Embedded Styles -->
  <style>
    /* General Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Body */
    body {
      font-family: Arial, sans-serif;
      background-color: #f3f3f3;
      color: #333;
    }

    /* Top Bar */
    .top-bar {
      background-color: #2c3e50;
      padding: 1rem;
      text-align: center;
    }

    .top-bar h2 {
      color: #fff;
      font-weight: 400;
      margin: 0;
    }

    /* Container */
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 4rem;
    }

    /* Auth Container */
    .auth-container {
      background-color: #fff;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      padding: 2rem 3rem;
      width: 350px;
      max-width: 90%;
      text-align: center;
    }

    .auth-container h1 {
      margin-bottom: 1.5rem;
      font-weight: 400;
    }

    /* Form & Inputs */
    form {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    label {
      margin-bottom: 0.3rem;
      font-size: 0.9rem;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    /* Button */
    button[type="submit"] {
      width: 100%;
      background-color: #2980b9;
      color: #fff;
      padding: 0.75rem;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button[type="submit"]:hover {
      background-color: #21618c;
    }

    /* Register Link */
    .auth-container p {
      margin-top: 1.5rem;
      font-size: 0.9rem;
    }

    .auth-container a {
      color: #2980b9;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .auth-container a:hover {
      color: #21618c;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <h2>Login</h2>
  </div>

  <div class="container">
    <div class="auth-container">
      <h1>Login</h1>
      <form method="POST">
        <label for="email">Email:</label>
        <input type="email" name="email" required /><br/><br/>
        <label for="password">Password:</label>
        <input type="password" name="password" required /><br/><br/>
        <button type="submit">Login</button>
      </form>
      <p>Don't have an account?
        <a href="{{ url_for('register') }}">Register here</a>
      </p>
    </div>
  </div>
</body>
</html>
